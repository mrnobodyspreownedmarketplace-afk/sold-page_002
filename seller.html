<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>555DEM ｜ 二手選物商店</title>
<style>
[hidden]{display:none!important}
:root{--ink:#101e2f;--blue:#102439;--pale:#f3f5f7;--orange:#ce461a;--line:#dce2e8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--pale)}button,input,select,textarea{font:inherit}button,a,select{cursor:pointer}a{color:inherit;text-decoration:none}button{border:0}header{background:#101e2f;color:white}.wrap{width:min(1200px,calc(100% - 48px));margin:auto}.top{min-height:79px;display:flex;gap:34px;align-items:center}.brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:900;letter-spacing:.04em;white-space:nowrap}.logo{width:43px;border-radius:50%;display:block}.search{flex:1;display:flex;border-radius:8px;overflow:hidden;background:white;min-height:44px}.search input{min-width:0;width:100%;border:0;padding:0 16px;color:var(--ink)}.search button,.cta{background:#ff8253;color:#24150f;font-weight:800;padding:10px 21px;border-radius:0}.admin{white-space:nowrap;font-size:14px;font-weight:700}.nav{background:white;border-bottom:1px solid var(--line)}.nav .wrap{display:flex;gap:28px;overflow:auto}.nav button{background:none;color:#475569;padding:15px 4px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:650}.nav button[aria-pressed=true]{color:var(--orange);border-color:var(--orange)}
.hero{margin-top:26px;display:flex;justify-content:space-between;align-items:center;overflow:hidden;min-height:310px;padding:36px 58px;background:radial-gradient(ellipse at 80% 20%,#244562,#112439 64%);color:white;border-radius:17px}.hero h1{font-size:clamp(37px,5.8vw,69px);letter-spacing:-.055em;line-height:1.1;margin:13px 0}.hero small{font-weight:800;color:#ff9a72;letter-spacing:.21em}.hero p{color:#c4d1dd;margin:0 0 25px}.hero img{width:clamp(120px,28vw,260px);border-radius:50%;box-shadow:0 0 0 13px #ffffff0a,0 0 0 30px #ffffff08;transform:rotate(-8deg)}.cta{display:inline-block;border-radius:7px}
.section{padding:32px 0 49px}.heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}.heading h2{margin:0}.heading p{font-size:14px;color:#475569;margin:6px 0 0}.heading select{background:white;border:1px solid var(--line);border-radius:8px;padding:9px;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.empty{grid-column:1/-1;text-align:center;padding:44px 16px;background:white;border:1px solid var(--line);border-radius:12px;color:#475569}.card{display:block;text-align:left;padding:0;background:white;border:1px solid var(--line);border-radius:11px;overflow:hidden;color:var(--ink);width:100%}.card:hover{box-shadow:0 5px 20px #101e2f1a}.card img,.detail-photo{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#e9eef2}.copy{padding:15px;display:grid;gap:8px}.copy small{color:#4e6174}.copy strong{overflow-wrap:anywhere}.price{font-size:20px;color:var(--orange);font-weight:800}.foot{border-top:1px solid var(--line);padding:23px 0;color:#556577;font-size:14px}.foot .wrap{display:flex;justify-content:space-between;gap:12px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin:26px auto}.panel form{display:grid;gap:14px;max-width:600px}.panel label{display:grid;gap:5px;font-weight:650}.panel input,.panel select,.panel textarea{padding:10px;border:1px solid #aebbc6;border-radius:5px;width:100%}.panel a:not(.cta){text-decoration:underline}.panel button{width:fit-content}dialog{border:0;border-radius:14px;width:min(450px,calc(100% - 32px));padding:16px;color:var(--ink)}dialog::backdrop{background:#101e2f99}dialog p{white-space:pre-wrap;overflow-wrap:anywhere}dialog button{float:right;background:#eef1f4;padding:7px 13px;border-radius:6px;margin-bottom:10px}.detail-photo{border-radius:8px}
@media(max-width:740px){.wrap{width:calc(100% - 28px)}.top{padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:10px}.search{grid-row:2;grid-column:1/-1}.hero{padding:25px;min-height:245px;gap:15px}.hero img{width:clamp(74px,24vw,150px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.nav .wrap{gap:20px}.hero p{font-size:14px}.brand{font-size:22px}}
.login-actions{display:flex;flex-wrap:wrap;gap:10px}.panel .guest{background:#e9eef2;color:var(--ink)}</style></head><body>
<header><div class="wrap top"><a class="brand" href="./"><img class="logo" src="./logo.webp" alt="">555DEM</a>
<form class="search" action="./" role="search"><input id="query" name="q" type="search" placeholder="搜尋商品名稱或關鍵字" aria-label="搜尋商品"><button>搜尋</button></form>
<a class="admin" href="./seller.html">賣家中心</a></div></header>
<main class="wrap panel"><h1>555DEM 賣家中心</h1>
<p id="status" role="status" aria-live="polite">正在確認登入狀態…</p>
<div class="login-actions"><a class="cta guest" href="./#products">訪客瀏覽</a><button class="cta" type="button" id="signin" disabled>賣家使用 Google 登入</button><button class="cta" type="button" id="signout" hidden>登出</button></div>
<form id="listing" style="display:none;margin-top:20px">
    <label>商品名稱<input name="name" required maxlength="70"></label>
    <label>售價（新台幣）<input name="price" type="number" required min="1" max="10000000"></label>
    <label>商品分類<select name="category"><option>電玩遊戲</option><option>運動用品</option><option>3C 配件</option><option>生活選物</option></select></label>
    <label>商品狀況<select name="condition"><option>全新未使用</option><option>近全新</option><option>良好</option><option>有使用痕跡</option></select></label>
    <label>商品描述<textarea name="description" required maxlength="280" rows="5"></textarea></label>
    <label>商品照片（最多 3 張，每張最多 5 MB；第一張為封面）<input name="photo" type="file" accept="image/jpeg,image/png,image/webp" multiple required></label>
    <button class="cta">上架商品</button></form>
<section id="manage" hidden style="margin-top:32px">
  <h2>已上架商品</h2>
  <p id="manage-status" role="status"></p>
  <ul id="manage-list" style="display:grid;gap:12px;padding-left:20px"></ul>
</section></main><script src="./seller.js" type="module"></script></body></html>
